name: ci

on:
  push:
    branches: ["main", "build/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --frozen fails the build if uv.lock and pyproject.toml have drifted,
      # rather than silently resolving something newer. The whole point of
      # committing the lock is that CI runs the versions we measured with.
      - name: Install
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Typecheck
        run: uv run mypy src/channels

      # No network in this job: every test that needs a corpus or a model
      # checkpoint is marked `integration` and skipped here.
      - name: Test
        run: uv run pytest -m "not integration" --cov=src --cov-report=term-missing

      - name: Publication-safety checks
        run: uv run pytest -m "not integration" tests/test_publication_safety.py -q
